<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistralia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #E4FAF7;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Logo centrato, metà larghezza */
        .hero {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 20px;
            padding-bottom: 30px;
            background: #E4FAF7; /* stesse bande laterali */
        }

        .hero img {
            width: 50%;
            height: auto;
            max-width: 500px; /* limite per schermi grandi */
            min-width: 200px; /* limite per schermi piccoli */
        }

        /* Sezione testo in basso */
        .bottom-text {
            margin-top: auto;  
            display: flex;
            justify-content: space-between;
            gap: 40px;
            padding: 30px;
            box-sizing: border-box;
        }

        .box {
            flex: 1;
            min-width: 200px;
            text-align: center;
            color: #333;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 1.6rem;
        }

        p {
            margin: 5px 0;
            font-size: 1rem;
            line-height: 1.4;
        }

        .email {
            font-weight: bold;
            margin-top: 8px;
        }

        /* Mobile: i due box diventano verticali */
        @media (max-width: 700px) {
            .bottom-text {
                flex-direction: column;
                gap: 20px;
            }

            .hero img {
                width: 70%;
            }
        }
    </style>
</head>
<body>

    <div class="hero">
        <img src="logo-landing-page.png" alt="Mistralia logo">
    </div>

    <div class="bottom-text">
        <div class="box">
            <h1>Benvenuto!</h1>
            <p>Questo sito è attualmente in costruzione.</p>
            <p class="email">Puoi contattarci a: info@mistralia.co</p>
        </div>

        <div class="box">
            <h1>Welcome!</h1>
            <p>This site is currently under construction.</p>
            <p class="email">You can reach us at: info@mistralia.co</p>
        </div>
    </div>

</body>
</html>
