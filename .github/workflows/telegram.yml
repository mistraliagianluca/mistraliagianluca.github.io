# Legge i pulsanti, le risposte e i voti nel gruppo Telegram e fa i lavori a orario (sondaggio del lunedì, radar eventi).
# Lo sveglia cron-job.org ogni minuto; il cron qui sotto è solo una riserva.
# Se è cambiato qualcosa del sito (articolo pubblicato, traduzione, offerta attivata dal radar) ripubblica il sito.
name: Bot Telegram

on:
  schedule:
    - cron: '7,22,37,52 6-21 * * *'   # evitiamo i minuti :00 e :15, i più affollati su GitHub
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: automazione
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # ultima versione, non quella di quando il giro è stato messo in coda (lo stato del bot cambia di continuo)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node automazione/telegram.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
      - name: Salva modifiche
        if: always()
        run: |
          git config user.name "Mistralia bot"
          git config user.email "bot@mistralia.co"
          git add automazione src/content/diario public/assets/diario src/data/promo.md
          git diff --cached --quiet || git commit -m "Bot Telegram: aggiornamento" && git pull --rebase --autostash && git push
      - name: Ripubblica il sito se è cambiato qualcosa (articolo, traduzione, offerta)
        run: if [ -f automazione/.da-pubblicare ]; then gh workflow run deploy.yml --ref main; fi
        env:
          GH_TOKEN: ${{ github.token }}
