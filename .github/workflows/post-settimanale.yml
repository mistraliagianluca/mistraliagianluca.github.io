# Prepara SUBITO una bozza e la manda al gruppo Telegram (solo a mano).
# La bozza del lunedì la prepara il Bot Telegram (vedi postSettimanale in automazione/config.json).
# Per una bozza in più è meglio scrivere /nuovo nel gruppo.
name: Post settimanale

on:
  workflow_dispatch:       # per lanciarlo a mano dalla scheda Actions

permissions:
  contents: write

concurrency:
  group: automazione
  cancel-in-progress: false

jobs:
  bozza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # ultima versione, non quella di quando il giro è stato messo in coda (lo stato del bot cambia di continuo)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node automazione/genera.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
      - name: Salva bozza e stato
        if: always()
        run: |
          git config user.name "Mistralia bot"
          git config user.email "bot@mistralia.co"
          git add automazione
          git diff --cached --quiet || git commit -m "Bozza post settimanale" && git pull --rebase --autostash && git push
